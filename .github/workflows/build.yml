# =============================================================================
# Edureone Campus student app (React Native / Expo) — Android + iOS builds.
#
# Runs entirely inside THIS repository. It does not touch the web frontend
# repo, its Capacitor "Mobile release" workflow, or any server.
#
#   push to main / pull request : verification builds
#        Android  release APK (debug-signed unless the upload key is set)
#        iOS      Release build for the simulator + an unsigned device build
#   Actions → "Build apps" → Run workflow : store builds
#        Android  signed AAB + APK  (needs the ANDROID_* secrets)
#        iOS      signed IPA        (needs the IOS_* secrets + APPLE_TEAM_ID)
#
# Settings → Secrets and variables → Actions
#   Variables : EXPO_PUBLIC_WEB_URL (or MOBILE_SERVER_URL), EXPO_PUBLIC_API_URL
#               (or VITE_API_URL), APPLE_TEAM_ID,
#               APP_BUNDLE_ID (optional, default com.seereon.edureon)
#   Secrets   : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#               ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON (optional, enables push),
#               IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
#               IOS_PROVISIONING_PROFILE_BASE64  (or, simpler: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)
#   The same values as the web repo's Mobile release workflow can be reused.
# =============================================================================
name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Store version (e.g. 1.1.0)"
        required: true
        default: "1.0.0"
      build_number:
        description: "Android versionCode / iOS build number (higher than any build already uploaded, including the Capacitor app's)"
        required: true
        default: "100"
      store_build:
        description: "Sign for the stores (fails if signing secrets are missing)"
        type: boolean
        default: true
      ios:
        description: "Also build iOS (needs an active Apple Developer account)"
        type: boolean
        default: true

permissions:
  contents: read

# A new push cancels the previous verification build, but never a store build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_VERSION: "22"
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || vars.VITE_API_URL }}
  EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || vars.MOBILE_SERVER_URL }}
  APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
  APP_VERSION: ${{ github.event.inputs.version_name || '1.0.0' }}
  APP_BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
  STORE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store_build == 'true' }}
  EXPO_NO_TELEMETRY: "1"

jobs:
  checks:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src app.config.ts plugins

  android:
    name: Android
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # The runner image already ships the Android SDK; its default package
      # list ("tools") no longer exists, so name the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Firebase config (optional, enables push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
          else
            echo "::notice::GOOGLE_SERVICES_JSON not set: building without FCM push."
          fi

      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            # Keystores made by the "Create Android upload key" workflow are also
            # encrypted with the keystore password (the repo is public).
            if [ "$(head -c 8 "$RUNNER_TEMP/upload.jks")" = "Salted__" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:ANDROID_KEYSTORE_PASSWORD \
                -in "$RUNNER_TEMP/upload.jks" -out "$RUNNER_TEMP/upload.dec.jks"
              mv "$RUNNER_TEMP/upload.dec.jks" "$RUNNER_TEMP/upload.jks"
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$STORE_BUILD" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; a store build must be signed with your upload key."
            exit 1
          else
            echo "::notice::No upload key: this verification APK is debug-signed (do not upload it)."
          fi
          [ "$STORE_BUILD" = "true" ] && echo "REQUIRE_RELEASE_SIGNING=1" >> "$GITHUB_ENV" || true

      - name: Portal address set?
        run: |
          if [ -z "$EXPO_PUBLIC_WEB_URL" ]; then
            if [ "$STORE_BUILD" = "true" ]; then echo "::error::Repository variable EXPO_PUBLIC_WEB_URL is empty; the app would have no portal to open."; exit 1; fi
            echo "::warning::Repository variable EXPO_PUBLIC_WEB_URL is empty: this verification build shows a 'Portal address missing' screen."
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::Repository variable EXPO_PUBLIC_API_URL is empty: push notifications cannot be registered."
          fi

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle release build
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          V="$APP_VERSION-$APP_BUILD_NUMBER"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/edureone-campus-$V.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/edureone-campus-$V.aab"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}
          path: out/*
          if-no-files-found: error

  android-launch-test:
    # Opens the APK just built on an Android emulator and fails if it crashes
    # on start, so a broken build never reaches a phone or the Play Store.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          path: apk
          pattern: android-*
      - name: Find APK
        run: echo "APK=$(find apk -name '*.apk' | head -1)" >> "$GITHUB_ENV"
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.seereon.edureon -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d -b crash > crash.txt || true
            cat crash.txt
            adb shell pidof com.seereon.edureon || (echo "::error::The app is not running 40 s after launch" && exit 1)
            ! grep -q "com.seereon.edureon" crash.txt || (echo "::error::The app crashed on launch (see the log above)" && exit 1)

  ios:
    name: iOS
    needs: checks
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.ios == 'true' }}
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      # Expo SDK 58's expo-modules-jsi needs a newer Swift compiler than the
      # macos-15 image has (Xcode 26.2/26.3 fail with "sending 'slot' risks
      # causing data races"), so use the newest Xcode on the macos-26 image.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          X=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: npm ci

      - name: Firebase config (iOS push)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist
            plutil -lint GoogleService-Info.plist
            /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" GoogleService-Info.plist
            echo "GOOGLE_SERVICES_PLIST_FILE=./GoogleService-Info.plist" >> "$GITHUB_ENV"
          elif [ "$STORE_BUILD" = "true" ]; then
            echo "::error::Secret GOOGLE_SERVICE_INFO_PLIST is missing: an App Store build without it gets no push notifications."
            exit 1
          else
            echo "::notice::GOOGLE_SERVICE_INFO_PLIST not set: building iOS without push."
          fi

      - name: Generate native project + CocoaPods
        run: |
          npx expo prebuild --platform ios --no-install --clean
          cd ios && pod install

      - name: Release build (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcbfail() { echo "::group::xcodebuild errors"; grep -nE "(error|fatal error):|\*\* (BUILD|ARCHIVE) FAILED|Command .* failed" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-600 | head -80; echo "::endgroup::"; grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -5 | cut -c1-400 | sed 's/^/::error::/'; tail -n 80 "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400; }
          xcodebuild -workspace EdureoneCampus.xcworkspace -scheme EdureoneCampus \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { xcbfail; exit 1; }
          tail -n 20 "$RUNNER_TEMP/xcodebuild.log"

      - name: Release build (device, unsigned)
        if: ${{ env.STORE_BUILD != 'true' }}
        working-directory: ios
        run: |
          set -o pipefail
          xcbfail() { echo "::group::xcodebuild errors"; grep -nE "(error|fatal error):|\*\* (BUILD|ARCHIVE) FAILED|Command .* failed" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-600 | head -80; echo "::endgroup::"; grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -5 | cut -c1-400 | sed 's/^/::error::/'; tail -n 80 "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400; }
          xcodebuild -workspace EdureoneCampus.xcworkspace -scheme EdureoneCampus \
            -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { xcbfail; exit 1; }
          tail -n 20 "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Package simulator app
        run: |
          APP=$(find "$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          mkdir -p out && ditto -c -k --keepParent "$APP" "out/EdureoneCampus-simulator-$APP_VERSION-$APP_BUILD_NUMBER.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}
          path: out/*.zip

      # ---- Signed App Store build (manual runs with store_build) -------------
      # Two ways to sign the App Store build:
      #  A) App Store Connect API key (simplest): secrets ASC_KEY_ID, ASC_ISSUER_ID,
      #     ASC_KEY_P8 (the .p8 file's text). Xcode creates the certificate and
      #     profile itself, and the build is uploaded to TestFlight.
      #  B) Manual: secrets IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD,
      #     IOS_PROVISIONING_PROFILE_BASE64.
      # Both need the APPLE_TEAM_ID variable.
      - name: Signing setup
        if: ${{ env.STORE_BUILD == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Repository variable APPLE_TEAM_ID is required for an App Store build (developer.apple.com > Membership)."
            exit 1
          fi
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
            {
              echo "SIGN_MODE=api"
              echo "ASC_KEY_PATH=$KEY_PATH"
              echo "ASC_KEY_ID=$ASC_KEY_ID"
              echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Signing with the App Store Connect API key (automatic signing)."
            exit 0
          fi
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Add either the App Store Connect API key secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) or IOS_CERTIFICATE_P12_BASE64 + IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"; KEYCHAIN_PW="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          { echo "SIGN_MODE=manual"; echo "PROFILE_UUID=$UUID"; } >> "$GITHUB_ENV"

      - name: Archive + export IPA
        if: ${{ env.STORE_BUILD == 'true' }}
        working-directory: ios
        run: |
          set -o pipefail
          xcbfail() { echo "::group::xcodebuild errors"; grep -nE "(error|fatal error):|\*\* (BUILD|ARCHIVE|EXPORT) FAILED|Command .* failed" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-600 | head -80; echo "::endgroup::"; grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -5 | cut -c1-400 | sed 's/^/::error::/'; tail -n 80 "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400; }
          BUNDLE_ID=$(node -p "require('../node_modules/expo/config').getConfig('..',{skipSDKVersionRequirement:true}).exp.ios.bundleIdentifier")
          if [ "$SIGN_MODE" = "api" ]; then
            AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
            # Archive unsigned (needs no development profile or registered iPhone;
            # Xcode keeps the entitlements in the archive), then the export step signs
            # for the App Store with Apple's cloud-managed distribution certificate.
            SIGN=(DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
            OPTS="<key>signingStyle</key><string>automatic</string>"
          else
            AUTH=()
            SIGN=(DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY="Apple Distribution")
            OPTS="<key>signingStyle</key><string>manual</string><key>signingCertificate</key><string>Apple Distribution</string><key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string></dict>"
          fi
          xcodebuild -workspace EdureoneCampus.xcworkspace -scheme EdureoneCampus -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" "${SIGN[@]}" archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { xcbfail; exit 1; }
          tail -n 20 "$RUNNER_TEMP/xcodebuild.log"
          write_opts() {
            cat > "$RUNNER_TEMP/ExportOptions-$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            ${OPTS}
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          }
          write_opts export
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" "${AUTH[@]}" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/export" > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { xcbfail; exit 1; }
          mkdir -p ../out-ipa && cp "$RUNNER_TEMP/export/"*.ipa "../out-ipa/EdureoneCampus-$APP_VERSION-$APP_BUILD_NUMBER.ipa"
          # The App Store build must carry the push entitlement (production).
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa" && unzip -q ../out-ipa/*.ipa -d "$RUNNER_TEMP/ipa"
          ENT=$(codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app 2>/dev/null)
          echo "$ENT" | grep -A1 -E "aps-environment|application-identifier"
          echo "$ENT" | grep -A1 "aps-environment" | grep -q production || { echo "::error::The signed app has no production push entitlement."; exit 1; }
          if [ "$SIGN_MODE" = "api" ]; then
            # Same archive, sent to App Store Connect: it appears in TestFlight in ~10-30 minutes.
            write_opts upload
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" "${AUTH[@]}" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -exportPath "$RUNNER_TEMP/upload" > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
              && echo "::notice::Uploaded to App Store Connect (TestFlight)." \
              || { xcbfail; echo "::warning::Upload to App Store Connect failed; the signed IPA is still attached to this run (upload it with Transporter)."; }
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ env.STORE_BUILD == 'true' }}
        with:
          name: ios-${{ env.APP_VERSION }}-${{ env.APP_BUILD_NUMBER }}
          path: out-ipa/*.ipa
          if-no-files-found: error
